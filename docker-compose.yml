version: "3.9"
services:
  assistant:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./documents:/app/documents
      - ./chroma_db:/app/chroma_db
      - ./data:/app/data
    environment:
      - LLM_MODEL_PATH=/app/models/Llama-3.2-3B-Instruct-Q4_K_M.gguf
      - CHROMA_PATH=/app/chroma_db
      - DATA_PATH=/app/data
      - N_THREADS=8
      - LOG_LEVEL=INFO
    restart: unless-stopped
