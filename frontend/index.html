<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEC Investment Research Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-0: #0a0f1e;
      --bg-1: #151d34;
      --bg-2: #1a243f;
      --line: rgba(0, 212, 255, 0.22);
      --glow: #00d4ff;
      --good: #34d399;
      --warn: #fbbf24;
      --bad: #f87171;
      --text: #e7edf8;
      --muted: #97a6c0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 0%, rgba(0, 212, 255, 0.15), transparent 30%),
        radial-gradient(circle at 90% 100%, rgba(56, 189, 248, 0.15), transparent 35%),
        linear-gradient(180deg, var(--bg-0), #060a13 70%);
      overflow: hidden;
    }

    .app {
      display: grid;
      grid-template-rows: 64px 1fr;
      height: 100vh;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(10, 15, 30, 0.72);
      backdrop-filter: blur(8px);
    }

    .brand {
      display: flex;
      gap: 12px;
      align-items: center;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.04em;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--bad);
      box-shadow: 0 0 10px var(--bad);
      transition: all .2s ease;
    }

    .status-dot.online {
      background: var(--good);
      box-shadow: 0 0 10px var(--good);
    }

    .main {
      display: grid;
      grid-template-columns: 280px 1fr 320px;
      gap: 14px;
      padding: 14px;
      min-height: 0;
    }

    .sidebar-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
    }

    .panel {
      background: linear-gradient(180deg, rgba(21, 29, 52, 0.95), rgba(12, 18, 32, 0.95));
      border: 1px solid var(--line);
      border-radius: 14px;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      color: #b4c4df;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .latency-content,
    .sessions-content,
    .market-content {
      padding: 12px;
      overflow: auto;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
    }

    .sessions-toolbar {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-bottom: 1px solid rgba(0, 212, 255, 0.12);
      flex-wrap: wrap;
    }

    .session-card {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
      padding: 10px 12px;
      border: 1px solid rgba(151, 166, 192, 0.16);
      border-radius: 12px;
      background: rgba(12, 18, 32, 0.65);
      color: var(--text);
      cursor: pointer;
      text-align: left;
      margin-bottom: 10px;
    }

    .session-card.active {
      border-color: rgba(0, 212, 255, 0.52);
      box-shadow: 0 0 0 1px rgba(0, 212, 255, 0.12) inset;
      background: rgba(0, 212, 255, 0.08);
    }

    .session-card-title {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
    }

    .session-card-meta {
      color: var(--muted);
      line-height: 1.35;
    }

    .session-empty {
      padding: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    .session-badge {
      font-size: 10px;
      padding: 3px 6px;
      border-radius: 999px;
      border: 1px solid rgba(151, 166, 192, 0.18);
      color: var(--muted);
    }

    .session-badge.active {
      color: var(--glow);
      border-color: rgba(0, 212, 255, 0.35);
      background: rgba(0, 212, 255, 0.1);
    }

    .latency-row { margin-bottom: 10px; }
    .latency-row-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      color: var(--muted);
    }

    .bar {
      width: 100%;
      height: 8px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .bar > span {
      display: block;
      height: 100%;
      width: 0%;
      transition: width .3s ease;
    }

    .chat-body {
      display: flex;
      flex-direction: column;
      min-height: 0;
      flex: 1;
    }

    .messages {
      flex: 1;
      overflow: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bubble {
      max-width: 88%;
      padding: 10px 12px;
      border-radius: 10px;
      line-height: 1.4;
      font-size: 14px;
      white-space: pre-wrap;
      border: 1px solid transparent;
    }

    .bubble.user {
      align-self: flex-end;
      background: rgba(0, 212, 255, 0.14);
      border-color: rgba(0, 212, 255, 0.35);
    }

    .bubble.assistant {
      align-self: flex-start;
      background: rgba(26, 36, 63, 0.95);
      border-color: rgba(151, 166, 192, 0.25);
    }

    .source {
      color: #7dd3fc;
      font-weight: 600;
    }

    .composer {
      border-top: 1px solid var(--line);
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      align-items: center;
    }

    .composer input {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(12, 18, 32, 0.85);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
    }

    .btn {
      border: 1px solid var(--line);
      background: rgba(0, 212, 255, 0.12);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .btn:active { transform: translateY(1px); }

    .recording {
      position: relative;
      overflow: hidden;
    }

    .recording::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent, rgba(248, 113, 113, 0.35), transparent);
      animation: sweep 1.2s linear infinite;
    }

    @keyframes sweep {
      from { transform: translateX(-100%); }
      to { transform: translateX(100%); }
    }

    .wave {
      display: flex;
      gap: 3px;
      align-items: flex-end;
      height: 18px;
      margin-left: 8px;
      opacity: 0;
      transition: opacity .2s ease;
    }

    .wave.active { opacity: 1; }

    .wave span {
      width: 3px;
      background: var(--bad);
      border-radius: 2px;
      animation: pulse 0.8s ease-in-out infinite;
    }

    .wave span:nth-child(2) { animation-delay: .1s; }
    .wave span:nth-child(3) { animation-delay: .2s; }
    .wave span:nth-child(4) { animation-delay: .3s; }
    .wave span:nth-child(5) { animation-delay: .4s; }

    @keyframes pulse {
      0%, 100% { height: 4px; }
      50% { height: 16px; }
    }

    .ticker-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 10px;
      border-bottom: 1px solid rgba(151, 166, 192, 0.12);
    }

    .muted { color: var(--muted); }

    @media (max-width: 1024px) {
      .main {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(300px, 1fr) auto;
      }
      .panel { min-height: 220px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">SEC INVESTMENT RESEARCH ASSISTANT</div>
      <div class="status"><span id="statusDot" class="status-dot"></span><span id="statusText">offline</span></div>
    </header>

    <main class="main">
      <section class="sidebar-stack">
        <section class="panel">
          <div class="panel-header">Sessions</div>
          <div class="sessions-toolbar">
            <button id="newSessionBtn" class="btn" type="button">New Session</button>
            <button id="refreshSessionsBtn" class="btn" type="button">Refresh</button>
          </div>
          <div id="sessionsContent" class="sessions-content"></div>
        </section>

        <section class="panel">
          <div class="panel-header">Latency Dashboard</div>
          <div id="latencyContent" class="latency-content"></div>
        </section>
      </section>

      <section class="panel chat-body">
        <div id="messages" class="messages"></div>
        <div class="composer">
          <input id="textInput" placeholder="Ask about SEC filings, prices, news, or calculations..." />
          <button id="micBtn" class="btn">Hold to Talk</button>
          <button id="sendBtn" class="btn">Send</button>
          <div id="wave" class="wave" style="grid-column: 1 / -1; justify-self: end;">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">Market Sidebar</div>
        <div id="marketContent" class="market-content"></div>
      </section>
    </main>
  </div>

  <script>
    const sessionsContent = document.getElementById('sessionsContent');
    const messagesEl = document.getElementById('messages');
    const textInput = document.getElementById('textInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');
    const newSessionBtn = document.getElementById('newSessionBtn');
    const refreshSessionsBtn = document.getElementById('refreshSessionsBtn');
    const waveEl = document.getElementById('wave');
    const latencyEl = document.getElementById('latencyContent');
    const marketEl = document.getElementById('marketContent');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');

    const SESSION_KEY = 'sec_assistant_session_id';
    const SESSION_MESSAGES_KEY = 'sec_assistant_session_messages';
    const sessionsCache = new Map();
    const sessionMessages = new Map();

    function newSessionId() {
      return crypto.randomUUID();
    }

    let sessionId = localStorage.getItem(SESSION_KEY);
    if (!sessionId) {
      sessionId = newSessionId();
      localStorage.setItem(SESSION_KEY, sessionId);
    }

    let ws = null;
    let reconnectDelay = 500;
    let currentAssistantBubble = null;
    let shouldReconnect = true;
    let mediaRecorder = null;
    let recordingMimeType = 'audio/webm';
    let recordedChunks = [];
    let recordingStart = 0;
    const latencyHistory = [];

    class AudioQueue {
      constructor() {
        this.queue = [];
        this.isPlaying = false;
        this.currentAudio = null;
        this.currentUrl = null;
      }

      enqueue(base64Audio, mimeType = 'audio/mpeg') {
        this.queue.push({ base64Audio, mimeType });
        this.playNext();
      }

      async playNext() {
        if (this.isPlaying || this.queue.length === 0) {
          return;
        }

        this.isPlaying = true;
        const item = this.queue.shift();

        try {
          const binary = atob(item.base64Audio);
          const bytes = new Uint8Array(binary.length);
          for (let index = 0; index < binary.length; index += 1) {
            bytes[index] = binary.charCodeAt(index);
          }

          const blob = new Blob([bytes], { type: item.mimeType });
          const url = URL.createObjectURL(blob);
          const audio = new Audio(url);
          this.currentAudio = audio;
          this.currentUrl = url;

          audio.onended = () => {
            URL.revokeObjectURL(url);
            this.isPlaying = false;
            this.currentAudio = null;
            this.currentUrl = null;
            this.playNext();
          };
          audio.onerror = () => {
            URL.revokeObjectURL(url);
            this.isPlaying = false;
            this.currentAudio = null;
            this.currentUrl = null;
            this.playNext();
          };

          await audio.play();
        } catch (error) {
          console.error('Audio playback error:', error);
          this.isPlaying = false;
          this.currentAudio = null;
          this.currentUrl = null;
          this.playNext();
        }
      }

      clear() {
        this.queue = [];
        this.isPlaying = false;
        if (this.currentAudio) {
          this.currentAudio.pause();
          this.currentAudio = null;
        }
        if (this.currentUrl) {
          URL.revokeObjectURL(this.currentUrl);
          this.currentUrl = null;
        }
      }

      stop() {
        this.clear();
      }
    }

    const audioQueuePlayer = new AudioQueue();

    function pickRecorderMimeType() {
      const preferred = [
        'audio/webm;codecs=opus',
        'audio/webm',
        'audio/ogg;codecs=opus',
        'audio/ogg'
      ];

      if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) {
        return '';
      }

      for (const mime of preferred) {
        if (MediaRecorder.isTypeSupported(mime)) {
          return mime;
        }
      }

      return '';
    }

    function guessFormatFromMimeType(mimeType) {
      const value = (mimeType || '').toLowerCase();
      if (value.includes('ogg')) return 'ogg';
      if (value.includes('wav')) return 'wav';
      if (value.includes('mp3') || value.includes('mpeg')) return 'mp3';
      return 'webm';
    }

    function backendHost() {
      const backendPort = '8000';

      if (location.protocol === 'file:') {
        return `127.0.0.1:${backendPort}`;
      }

      if (!location.port || location.port === backendPort) {
        return location.host;
      }

      return `${location.hostname}:${backendPort}`;
    }

    function wsUrl() {
      const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
      return `${protocol}://${backendHost()}/ws/${sessionId}`;
    }

    function apiUrl(path) {
      return `${location.protocol === 'file:' ? 'http' : location.protocol.slice(0, -1)}://${backendHost()}${path}`;
    }

    function setConnectionState(online) {
      statusDot.classList.toggle('online', online);
      statusText.textContent = online ? 'online' : 'offline';
    }

    function connectSocket() {
      const socket = new WebSocket(wsUrl());
      ws = socket;

      socket.onopen = () => {
        setConnectionState(true);
        reconnectDelay = 500;
      };

      socket.onclose = () => {
        setConnectionState(false);
        if (!shouldReconnect || ws !== socket) {
          return;
        }
        setTimeout(connectSocket, reconnectDelay);
        reconnectDelay = Math.min(reconnectDelay * 2, 6000);
      };

      socket.onerror = () => {
        if (ws === socket) {
          socket.close();
        }
      };

      socket.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        handleServerMessage(msg);
      };
    }

    function disconnectSocket() {
      shouldReconnect = false;
      if (ws) {
        ws.close();
        ws = null;
      }
    }

    function persistSessionMessages() {
      const payload = Object.fromEntries(sessionMessages.entries());
      localStorage.setItem(SESSION_MESSAGES_KEY, JSON.stringify(payload));
    }

    function hydrateSessionMessages() {
      try {
        const raw = localStorage.getItem(SESSION_MESSAGES_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        Object.entries(parsed).forEach(([key, value]) => {
          if (Array.isArray(value)) {
            sessionMessages.set(key, value);
          }
        });
      } catch (error) {
        console.warn('Could not restore session transcripts:', error);
      }
    }

    function ensureSessionStore(id) {
      if (!sessionMessages.has(id)) {
        sessionMessages.set(id, []);
      }
      return sessionMessages.get(id);
    }

    function getSessionLabel(session) {
      if (session.user_id) return session.user_id;
      return `Session ${session.session_id.slice(0, 8)}`;
    }

    function normalizeSession(session) {
      return {
        session_id: session.session_id,
        user_id: session.user_id || null,
        turn_count: Number(session.turn_count || 0),
        created_at: session.created_at || null,
        last_active: session.last_active || null,
        source: session.source || 'backend',
        local: Boolean(session.local),
      };
    }

    function mergeSessionList(remoteSessions) {
      const merged = new Map();

      remoteSessions.map(normalizeSession).forEach((session) => {
        merged.set(session.session_id, session);
      });

      sessionsCache.forEach((session, id) => {
        if (!merged.has(id)) {
          merged.set(id, session);
        }
      });

      if (!merged.has(sessionId)) {
        merged.set(sessionId, {
          session_id: sessionId,
          user_id: null,
          turn_count: 0,
          created_at: null,
          last_active: null,
          source: 'local',
          local: true,
        });
      }

      sessionsCache.clear();
      Array.from(merged.entries())
        .sort((left, right) => {
          const leftTime = new Date(left[1].last_active || left[1].created_at || 0).getTime();
          const rightTime = new Date(right[1].last_active || right[1].created_at || 0).getTime();
          return rightTime - leftTime;
        })
        .forEach(([id, session]) => sessionsCache.set(id, session));
    }

    function renderSessionMessages(id) {
      messagesEl.innerHTML = '';
      const entries = ensureSessionStore(id);
      entries.forEach((entry) => {
        const bubble = addBubble(entry.role, entry.text, false);
        if (entry.role === 'assistant' && entry.streaming) {
          currentAssistantBubble = bubble;
        }
      });
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function renderSessions() {
      const list = Array.from(sessionsCache.values());
      if (!list.length) {
        sessionsContent.innerHTML = '<div class="session-empty">No active sessions yet. Create one to start a new conversation.</div>';
        return;
      }

      sessionsContent.innerHTML = '';
      list.forEach((session) => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = `session-card${session.session_id === sessionId ? ' active' : ''}`;
        card.innerHTML = `
          <div class="session-card-title">
            <span>${getSessionLabel(session)}</span>
            <span class="session-badge${session.session_id === sessionId ? ' active' : ''}">${session.session_id === sessionId ? 'active' : session.source}</span>
          </div>
          <div class="session-card-meta">${session.session_id}</div>
          <div class="session-card-meta">Turns: ${session.turn_count || 0}${session.last_active ? ` | Last: ${new Date(session.last_active).toLocaleString()}` : ''}</div>
        `;
        card.addEventListener('click', () => activateSession(session.session_id));
        sessionsContent.appendChild(card);
      });
    }

    async function syncSessions() {
      try {
        const response = await fetch(apiUrl('/api/sessions'));
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        const sessions = await response.json();
        mergeSessionList(sessions);
        renderSessions();
      } catch (error) {
        console.warn('Session list sync failed:', error);
        renderSessions();
      }
    }

    function activateSession(nextSessionId, { createLocal = false } = {}) {
      if (!nextSessionId || nextSessionId === sessionId) {
        renderSessions();
        renderSessionMessages(sessionId);
        return;
      }

      disconnectSocket();
      audioQueuePlayer.stop();
      currentAssistantBubble = null;

      sessionId = nextSessionId;
      localStorage.setItem(SESSION_KEY, sessionId);
      if (createLocal) {
        sessionsCache.set(sessionId, {
          session_id: sessionId,
          user_id: null,
          turn_count: 0,
          created_at: new Date().toISOString(),
          last_active: new Date().toISOString(),
          source: 'local',
          local: true,
        });
      }

      ensureSessionStore(sessionId);
      renderSessions();
      renderSessionMessages(sessionId);
      shouldReconnect = true;
      connectSocket();
    }

    function createNewSession() {
      const id = newSessionId();
      activateSession(id, { createLocal: true });
    }

    function addBubble(role, text) {
      return addBubble(role, text, true);
    }

    function addBubble(role, text, persist = true) {
      const div = document.createElement('div');
      div.className = `bubble ${role}`;
      div.innerHTML = formatMessage(text);
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;

      if (persist) {
        const entries = ensureSessionStore(sessionId);
        entries.push({ role, text, streaming: false });
        persistSessionMessages();
      }

      return div;
    }

    function formatMessage(text) {
      const escaped = String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
      return escaped.replace(/\[Source:([^\]]+)\]/g, '<span class="source">[Source:$1]</span>');
    }

    function showToolHint(message) {
      const m = message.toLowerCase();
      if (m.includes('price') || m.includes('trading')) addBubble('assistant', '[Fetching stock price...]');
      if (m.includes('news')) addBubble('assistant', '[Fetching latest news...]');
      if (m.includes('calculate') || m.includes('roi') || m.includes('cagr')) addBubble('assistant', '[Running calculator tool...]');
      if (m.includes('profile') || m.includes('remember')) addBubble('assistant', '[Accessing CRM profile...]');
    }

    function sendText() {
      const message = textInput.value.trim();
      if (!message || !ws || ws.readyState !== WebSocket.OPEN) return;
      addBubble('user', message);
      showToolHint(message);
      currentAssistantBubble = addBubble('assistant', '');
      const entries = ensureSessionStore(sessionId);
      if (entries.length > 0) {
        entries[entries.length - 1].streaming = true;
        persistSessionMessages();
      }
      ws.send(JSON.stringify({ type: 'text_input', message }));
      textInput.value = '';
    }

    function enqueueAudio(base64Audio, mimeType = 'audio/mpeg') {
      audioQueuePlayer.enqueue(base64Audio, mimeType);
    }

    function colorForLatency(ms) {
      if (ms < 500) return 'var(--good)';
      if (ms <= 2000) return 'var(--warn)';
      return 'var(--bad)';
    }

    function renderLatency(stageMap) {
      latencyHistory.push(stageMap);
      if (latencyHistory.length > 20) latencyHistory.shift();

      const stages = Object.keys(stageMap);
      const maxMs = Math.max(...Object.values(stageMap), 1);

      latencyEl.innerHTML = '';
      stages.forEach((stage) => {
        const ms = Number(stageMap[stage] || 0);
        const row = document.createElement('div');
        row.className = 'latency-row';

        const avg = latencyHistory.reduce((acc, item) => acc + Number(item[stage] || 0), 0) / latencyHistory.length;

        row.innerHTML = `
          <div class="latency-row-top"><span>${stage}</span><span>${ms.toFixed(1)} ms | avg ${avg.toFixed(1)}</span></div>
          <div class="bar"><span style="width:${Math.max(4, (ms / maxMs) * 100)}%; background:${colorForLatency(ms)}"></span></div>
        `;
        latencyEl.appendChild(row);
      });
    }

    function renderMarketSidebar() {
      const quick = ['AAPL', 'MSFT', 'TSLA', 'NVDA'];
      marketEl.innerHTML = `
        ${quick.map((t) => `<div class="ticker-row"><span>${t}</span><span class="muted">live via tool</span></div>`).join('')}
        <div style="margin-top:12px" class="muted">Ask: "What is Nvidia trading at right now?"</div>
      `;
    }

    function handleServerMessage(msg) {
      if (msg.type === 'text_chunk') {
        if (!currentAssistantBubble) currentAssistantBubble = addBubble('assistant', '');
        currentAssistantBubble.innerHTML = formatMessage((currentAssistantBubble.textContent || '') + msg.content);
        const entries = ensureSessionStore(sessionId);
        const last = entries[entries.length - 1];
        if (last && last.role === 'assistant') {
          last.text = (last.text || '') + msg.content;
          last.streaming = true;
          persistSessionMessages();
        }
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return;
      }

      if (msg.type === 'audio_chunk') {
        enqueueAudio(msg.audio, msg.mime_type || 'audio/mpeg');
        return;
      }

      if (msg.type === 'audio_complete') {
        return;
      }

      if (msg.type === 'transcription') {
        addBubble('user', msg.text);
        return;
      }

      if (msg.type === 'turn_complete') {
        const entries = ensureSessionStore(sessionId);
        const last = entries[entries.length - 1];
        if (last && last.role === 'assistant') {
          last.streaming = false;
          persistSessionMessages();
        }
        renderLatency(msg.latency_breakdown || {});
        currentAssistantBubble = null;
        syncSessions();
        return;
      }

      if (msg.type === 'error') {
        addBubble('assistant', `Error: ${msg.message}`);
      }
    }

    async function startRecording() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        addBubble('assistant', 'Error: This browser does not support microphone capture.');
        return;
      }

      if (!ws || ws.readyState !== WebSocket.OPEN) {
        addBubble('assistant', 'Error: Connection is offline, please wait a moment and try again.');
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recordedChunks = [];

        const mimeType = pickRecorderMimeType();
        mediaRecorder = mimeType
          ? new MediaRecorder(stream, { mimeType })
          : new MediaRecorder(stream);

        recordingMimeType = mediaRecorder.mimeType || mimeType || 'audio/webm';

        mediaRecorder.ondataavailable = (event) => {
          if (event.data && event.data.size > 0) recordedChunks.push(event.data);
        };

        mediaRecorder.onstop = async () => {
          try {
            const blob = new Blob(recordedChunks, { type: recordingMimeType });
            const buffer = await blob.arrayBuffer();
            const bytes = new Uint8Array(buffer);
            let binary = '';
            bytes.forEach((b) => binary += String.fromCharCode(b));
            const base64Audio = btoa(binary);

            if (ws && ws.readyState === WebSocket.OPEN) {
              currentAssistantBubble = addBubble('assistant', '');
              const entries = ensureSessionStore(sessionId);
              if (entries.length > 0) {
                entries[entries.length - 1].streaming = true;
                persistSessionMessages();
              }
              ws.send(JSON.stringify({
                type: 'audio_input',
                session_id: sessionId,
                audio: base64Audio,
                format: guessFormatFromMimeType(recordingMimeType)
              }));
            }
          } finally {
            stream.getTracks().forEach((track) => track.stop());
          }
        };

        recordingStart = Date.now();
        waveEl.classList.add('active');
        micBtn.classList.add('recording');
        mediaRecorder.start();
      } catch (error) {
        addBubble('assistant', `Error: Could not start microphone (${error.message || error}).`);
      }
    }

    function stopRecording() {
      if (!mediaRecorder || mediaRecorder.state !== 'recording') return;
      mediaRecorder.stop();
      waveEl.classList.remove('active');
      micBtn.classList.remove('recording');
    }

    sendBtn.addEventListener('click', sendText);
    textInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendText();
    });

    newSessionBtn.addEventListener('click', createNewSession);
    refreshSessionsBtn.addEventListener('click', syncSessions);

    micBtn.addEventListener('mousedown', startRecording);
    micBtn.addEventListener('mouseup', stopRecording);
    micBtn.addEventListener('mouseleave', stopRecording);
    micBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); }, { passive: false });
    micBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopRecording(); }, { passive: false });

    hydrateSessionMessages();
    renderMarketSidebar();
    ensureSessionStore(sessionId);
    renderSessionMessages(sessionId);
    renderSessions();
    shouldReconnect = true;
    connectSocket();
    syncSessions();
  </script>
</body>
</html>
